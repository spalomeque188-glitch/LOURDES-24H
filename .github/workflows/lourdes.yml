name: Lourdes 24/7
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'
jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - run: |
          sudo apt update && sudo apt install -y ffmpeg
          pip install yt-dlp -U
          while true; do
            yt-dlp --extractor-args "youtube:player_client=android" -f "b" -o - https://www.youtube.com/@LeSanctuaireNotreDamedeLourdes/live | ffmpeg -re -i - -c:v libx264 -preset veryfast -b:v 2500k -maxrate 2500k -c:a aac -b:a 128k -f flv ${{ secrets.YT_KEY }}
            sleep 10
          done
